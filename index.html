<!DOCTYPE html>
<html>
<head>
    <title>3D Cube Animation</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;

            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background: black;
        }

        /* Background Video */

        #background-video {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            object-fit: cover;

            z-index: -2;
        }

        /* Dark layer over video */

        .overlay {
            position: fixed;

            top: 0;
            left: 0;

            width: 100vw;
            height: 100vh;

            background: rgba(0, 0, 0, 0.25);

            z-index: -1;
        }

        /* 3D Cube */

        .scene {
            width: 200px;
            height: 200px;

            perspective: 600px;
        }

        .cube {
            width: 100px;
            height: 100px;

            position: relative;

            transform-style: preserve-3d;

            animation: rotateCube 10s linear infinite;

            margin: 50px;
        }

        .face {
            position: absolute;

            width: 100px;
            height: 100px;

            border: 2px solid rgb(0, 0, 0);

            box-shadow:
                0 0 20px rgb(239, 5, 5);
        }

        .front {
            transform: translateZ(50px);
            background: red;
        }

        .back {
            transform: rotateY(180deg) translateZ(50px);
            background: blue;
        }

        .right {
            transform: rotateY(90deg) translateZ(50px);
            background: green;
        }

        .left {
            transform: rotateY(-90deg) translateZ(50px);
            background: yellow;
        }

        .top {
            transform: rotateX(90deg) translateZ(50px);
            background: orange;
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(50px);
            background: purple;
        }

        /* Cube Rotation */

        @keyframes rotateCube {

            from {
                transform: rotateX(0deg) rotateY(0deg);
            }

            to {
                transform: rotateX(360deg) rotateY(360deg);
            }

        }

    </style>
</head>

<body>

    <!-- Background Video -->

    <video id="background-video"
           autoplay
           muted
           loop
           playsinline>

        <source src="file:///C:/Users/Shashwanth%20CG/Downloads/140733-775596128.mp4"
                type="video/mp4">

    </video>

    <div class="overlay"></div>


    <!-- 3D Cube -->

    <div class="scene">

        <div class="cube">

            <div class="face front"></div>

            <div class="face back"></div>

            <div class="face right"></div>

            <div class="face left"></div>

            <div class="face top"></div>

            <div class="face bottom"></div>

        </div>

    </div>

</body>
</html>
